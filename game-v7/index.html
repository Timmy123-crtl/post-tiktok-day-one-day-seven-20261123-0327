<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost Dash — Day Seven</title>
<style>
  html,body{margin:0;padding:0;background:#14101a;width:1080px;height:1920px;overflow:hidden}
  canvas{display:block}
  #banner{position:absolute;left:0;top:640px;width:1080px;text-align:center;
    font:900 150px/1.1 "DejaVu Sans",sans-serif;color:#fff;letter-spacing:4px;
    text-shadow:0 8px 0 rgba(0,0,0,.35);opacity:0;pointer-events:none}
  #banner small{display:block;font-size:46px;letter-spacing:6px;color:#ffd94d;margin-top:18px}
  #banner.show{animation:bin 4s ease forwards}
  @keyframes bin{0%{opacity:0;transform:scale(.92)}8%{opacity:1;transform:scale(1)}
    80%{opacity:1}100%{opacity:0}}
  #cta{position:absolute;left:0;top:1560px;width:1080px;text-align:center;
    font:700 58px/1.35 "DejaVu Sans",sans-serif;color:#fff;opacity:0;pointer-events:none;
    text-shadow:0 4px 0 rgba(0,0,0,.4)}
  #cta.show{opacity:1;transition:opacity .6s}
  #cta b{color:#ffd94d}
</style>
</head>
<body>
<canvas id="game" width="1080" height="1920"></canvas>
<div id="banner"></div>
<div id="cta">Your turn.<br>Start yours at <b>make.fun</b></div>
<script>
"use strict";
// Ghost Dash — DAY SEVEN build. Same map, same start, same seed as Day One:
// same arena, same walls, same spawn point — visibly more going on.
// New in a week of daily updates: 5 stars at once, coins, shield power-up,
// 3 chasers + 2 patrollers, combo multiplier, levels, particles, trail, sound.
const P = new URLSearchParams(location.search);
const AUTO = P.get("auto") === "1";
const BANNER = P.get("banner") || "";
const CTA = P.get("cta") === "1";
const SEED = 20261123;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(SEED);

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
// Arena — identical to v1.
const ARENA = {x:40, y:430, w:1000, h:1070};
const WALLS = [
  {x:280, y:760, w:200, h:36}, {x:600, y:760, w:200, h:36},
  {x:280, y:1120, w:200, h:36}, {x:600, y:1120, w:200, h:36},
];
const START = {x:540, y:1350};

let score = 0, lives = 3, level = 1, combo = 0, comboT = 0, t = 0, shieldT = 0;
let bestCombo = 0, coinsGot = 0;
const player = {x:START.x, y:START.y, r:34, vx:0, vy:0, speed:360, trail:[]};
const stars = [], coins = [], chasers = [], patrollers = [], particles = [];
let shield = null;

function spawnStar(){
  stars.push({x:ARENA.x+70+rand()*(ARENA.w-140), y:ARENA.y+70+rand()*(ARENA.h-140),
              r:22, a:0});
}
function spawnCoin(){
  coins.push({x:ARENA.x+70+rand()*(ARENA.w-140), y:ARENA.y+70+rand()*(ARENA.h-140),
              r:16, a:rand()*6});
}
function spawnShield(){
  shield = {x:ARENA.x+70+rand()*(ARENA.w-140), y:ARENA.y+70+rand()*(ARENA.h-140), r:24, a:0};
}
for(let i=0;i<5;i++) spawnStar();
for(let i=0;i<3;i++) spawnCoin();
chasers.push(
  {x:540, y:560, r:30, speed:130},
  {x:200, y:600, r:26, speed:150},
  {x:880, y:600, r:26, speed:150});
patrollers.push(
  {x:200, y:950, r:24, speed:200, dir:1, axis:"x", min:120, max:960},
  {x:880, y:1250, r:24, speed:220, dir:-1, axis:"y", min:520, max:1420});
spawnShield();

// Tiny WebAudio blips (no assets).
let AC = null;
function beep(f, d){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.08, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
  }catch(e){}
}
function burst(x, y, color, n){
  for(let i=0;i<n;i++){
    const a=rand()*Math.PI*2, s=80+rand()*220;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.5+rand()*0.4,
                    max:0.9, color, r:4+rand()*6});
  }
}
function nearestTarget(){
  let best=null, bd=1e9;
  const all = stars.concat(coins).concat(shield?[shield]:[]);
  for(const s of all){const d=(s.x-player.x)**2+(s.y-player.y)**2; if(d<bd){bd=d;best=s;}}
  return best;
}
function collideWalls(o){
  o.x=Math.max(ARENA.x+o.r, Math.min(ARENA.x+ARENA.w-o.r, o.x));
  o.y=Math.max(ARENA.y+o.r, Math.min(ARENA.y+ARENA.h-o.r, o.y));
  for(const w of WALLS){
    const nx=Math.max(w.x,Math.min(o.x,w.x+w.w)), ny=Math.max(w.y,Math.min(o.y,w.y+w.h));
    const dx=o.x-nx, dy=o.y-ny, d2=dx*dx+dy*dy;
    if(d2 < o.r*o.r){
      const d=Math.sqrt(d2)||1, push=(o.r-d);
      o.x += dx/d*push; o.y += dy/d*push;
    }
  }
}
function hit(){
  if(shieldT > 0){ shieldT = 0; burst(player.x, player.y, "#7de3ff", 24); beep(220, 0.2); return; }
  lives--; combo = 0;
  burst(player.x, player.y, "#ff5d8f", 30); beep(140, 0.3);
  player.x=START.x; player.y=START.y;
  chasers[0].x=540; chasers[0].y=560;
  if(lives<=0){ lives=3; score=0; level=1; }
}
function step(dt){
  t += dt;
  if(comboT > 0){ comboT -= dt; if(comboT <= 0) combo = 0; }
  if(shieldT > 0) shieldT -= dt;
  let ax=0, ay=0;
  if(AUTO){
    const s=nearestTarget();
    if(s){const d=Math.hypot(s.x-player.x, s.y-player.y)||1;
      ax=(s.x-player.x)/d; ay=(s.y-player.y)/d;}
  }
  player.x += ax*player.speed*dt; player.y += ay*player.speed*dt;
  collideWalls(player);
  player.trail.push({x:player.x, y:player.y});
  if(player.trail.length > 14) player.trail.shift();
  for(const s of stars) s.a += dt*3;
  for(const c of coins) c.a += dt*4;
  if(shield) shield.a += dt*2;
  // Eat stars: combo multiplier, level up every 5 stars.
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i];
    if(Math.hypot(s.x-player.x, s.y-player.y) < player.r+s.r){
      stars.splice(i,1);
      combo++; comboT = 3; bestCombo = Math.max(bestCombo, combo);
      score += 10 * Math.max(1, combo);
      burst(s.x, s.y, "#ffd94d", 16); beep(520 + combo*60, 0.12);
      if(score >= level*50){ level++; for(const c of chasers) c.speed += 18; }
      spawnStar();
    }
  }
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    if(Math.hypot(c.x-player.x, c.y-player.y) < player.r+c.r){
      coins.splice(i,1); coinsGot++; score += 25;
      burst(c.x, c.y, "#7dff9e", 12); beep(880, 0.1); spawnCoin();
    }
  }
  if(shield && Math.hypot(shield.x-player.x, shield.y-player.y) < player.r+shield.r){
    shieldT = 6; shield = null;
    burst(player.x, player.y, "#7de3ff", 20); beep(660, 0.15);
    setTimeout(spawnShield, 8000);
  }
  for(const c of chasers){
    const d=Math.hypot(player.x-c.x, player.y-c.y)||1;
    c.x += (player.x-c.x)/d*c.speed*dt; c.y += (player.y-c.y)/d*c.speed*dt;
    collideWalls(c);
    if(d < player.r+c.r-6) hit();
  }
  for(const p of patrollers){
    if(p.axis==="x"){ p.x += p.dir*p.speed*dt; if(p.x<p.min||p.x>p.max) p.dir*=-1; }
    else { p.y += p.dir*p.speed*dt; if(p.y<p.min||p.y>p.max) p.dir*=-1; }
    if(Math.hypot(player.x-p.x, player.y-p.y) < player.r+p.r-6) hit();
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.life-=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; p.vy*=0.96;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawGhost(x,y,r,body,eye){
  ctx.fillStyle=body; ctx.beginPath();
  ctx.arc(x,y-r*0.25,r,Math.PI,0);
  ctx.lineTo(x+r, y+r*0.75);
  for(let i=0;i<3;i++){ctx.quadraticCurveTo(x+r*(0.66-i*0.66)+r*0.16, y+r*1.05,
    x+r*(0.33-i*0.66), y+r*0.75);}
  ctx.lineTo(x-r, y+r*0.75); ctx.closePath(); ctx.fill();
  ctx.fillStyle=eye; ctx.beginPath();
  ctx.arc(x-r*0.36, y-r*0.3, r*0.16, 0, 7); ctx.arc(x+r*0.36, y-r*0.3, r*0.16, 0, 7); ctx.fill();
}
function drawStar(s){
  ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(Math.sin(s.a)*0.2);
  ctx.fillStyle="#ffd94d"; ctx.beginPath();
  for(let i=0;i<10;i++){const r=i%2?s.r*0.45:s.r, a=-Math.PI/2+i*Math.PI/5;
    ctx[i?"lineTo":"moveTo"](Math.cos(a)*r, Math.sin(a)*r);}
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function draw(){
  ctx.fillStyle="#14101a"; ctx.fillRect(0,0,1080,1920);
  ctx.fillStyle="#fff"; ctx.font='900 84px "DejaVu Sans",sans-serif';
  ctx.textAlign="center"; ctx.fillText("GHOST DASH", 540, 150);
  ctx.font='700 52px "DejaVu Sans",sans-serif'; ctx.textAlign="left";
  ctx.fillStyle="#ffd94d"; ctx.fillText("SCORE  "+score, 60, 260);
  ctx.fillStyle="#ff5d8f"; ctx.textAlign="right";
  ctx.fillText("♥".repeat(lives), 1020, 260);
  ctx.textAlign="right"; ctx.fillStyle="#8f86a3"; ctx.font='600 40px "DejaVu Sans",sans-serif';
  ctx.fillText("v2.0  ·  LEVEL "+level, 1020, 330);
  if(combo >= 2){
    ctx.fillStyle="#7dff9e"; ctx.font='900 56px "DejaVu Sans",sans-serif';
    ctx.fillText("COMBO x"+combo, 540, 400);
  }
  // Arena.
  ctx.fillStyle="#1e1830"; ctx.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
  ctx.strokeStyle="#3a2f5e"; ctx.lineWidth=6; ctx.strokeRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
  ctx.fillStyle="#3a2f5e";
  for(const w of WALLS) ctx.fillRect(w.x, w.y, w.w, w.h);
  ctx.fillStyle="rgba(255,255,255,0.07)";
  for(let gx=ARENA.x+80; gx<ARENA.x+ARENA.w; gx+=120)
    for(let gy=ARENA.y+80; gy<ARENA.y+ARENA.h; gy+=120)
      {ctx.beginPath(); ctx.arc(gx,gy,5,0,7); ctx.fill();}
  for(const s of stars) drawStar(s);
  for(const c of coins){
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.a);
    ctx.fillStyle="#7dff9e"; ctx.beginPath(); ctx.arc(0,0,c.r,0,7); ctx.fill();
    ctx.fillStyle="#14101a"; ctx.font='900 26px "DejaVu Sans",sans-serif';
    ctx.textAlign="center"; ctx.fillText("$", 0, 9); ctx.restore();
  }
  if(shield){
    ctx.save(); ctx.translate(shield.x,shield.y);
    ctx.strokeStyle="#7de3ff"; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(0,0,shield.r+8+Math.sin(shield.a)*3,0,7); ctx.stroke();
    ctx.fillStyle="#7de3ff"; ctx.font='900 34px "DejaVu Sans",sans-serif';
    ctx.textAlign="center"; ctx.fillText("◈", 0, 12); ctx.restore();
  }
  for(const p of patrollers) drawGhost(p.x, p.y, p.r, "#b678ff", "#14101a");
  for(const c of chasers) drawGhost(c.x, c.y, c.r, "#ff5d8f", "#14101a");
  // Trail.
  for(let i=0;i<player.trail.length;i++){
    const tp=player.trail[i], a=i/player.trail.length*0.25;
    ctx.fillStyle="rgba(255,255,255,"+a.toFixed(2)+")";
    ctx.beginPath(); ctx.arc(tp.x, tp.y, player.r*0.7*i/player.trail.length, 0, 7); ctx.fill();
  }
  if(shieldT > 0){
    ctx.strokeStyle="rgba(125,227,255,0.9)"; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r+14, 0, 7); ctx.stroke();
  }
  drawGhost(player.x, player.y, player.r, "#ffffff", "#14101a");
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Bottom caption (hidden when the CTA overlay is on, so they never collide).
  if(!CTA){
  ctx.fillStyle="#8f86a3"; ctx.font='600 44px "DejaVu Sans",sans-serif'; ctx.textAlign="center";
  ctx.fillText("stars ×5 · coins · shield · combos · levels", 540, 1620);
  ctx.fillStyle="#5b5470"; ctx.font='600 38px "DejaVu Sans",sans-serif';
  ctx.fillText("same map, same start — 7 days of updates", 540, 1690);
  }
}
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  step(dt); draw();
  requestAnimationFrame(loop);
}
if(BANNER){
  const b = document.getElementById("banner");
  b.innerHTML = BANNER + "<small>THE SAME GAME · DAY 7</small>";
  b.classList.add("show");
}
if(CTA) document.getElementById("cta").classList.add("show");
requestAnimationFrame(loop);
</script>
</body>
</html>
